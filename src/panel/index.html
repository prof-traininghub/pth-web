<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de dirección | Professional Training Hub</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d231f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="../assets/img/pth-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/pth-apple-touch-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel PTH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preload" href="../assets/fonts/archivo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/archivo-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="panel.css">
<script>window.PTH_PANEL = { clientId: "{{CLIENT_ID}}", api: "{{SCRIPT_URL}}" };</script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="panel.js" defer></script>
</head>
<body class="pn">
<a class="pn-saltar" href="#vista">Saltar al contenido</a>
<aside class="pn-lado" id="lado">
  <div class="pn-lado-top">
    <a class="pn-logo" href="#inicio" aria-label="Panel de PTH, inicio">
      <img src="../assets/img/pth-logo-horizontal-blanco.svg" alt="Professional Training Hub" width="123" height="48">
    </a>
    <p class="pn-sello">Panel de dirección</p>
    <button class="pn-salir pn-solo-movil" type="button" data-accion="salir" hidden>Salir</button>
  </div>
  <nav class="pn-nav" id="nav" aria-label="Secciones del panel" hidden>
    <a href="#inicio" data-ruta="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Inicio</span></a>
    <a href="#alumnos" data-ruta="alumnos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg><span>Alumnos</span></a>
    <a href="#cuotas" data-ruta="cuotas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Cuotas</span></a>
    <a href="#avisos" data-ruta="avisos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span>Avisos</span></a>
    <a href="#devoluciones" data-ruta="devoluciones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="m8.5 10.5 2 2 4-4"/></svg><span>Devoluciones</span></a>
    <a href="#opiniones" data-ruta="opiniones"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Opiniones</span></a>
  </nav>
  <div class="pn-lado-pie" id="lado-pie" hidden>
    <a id="enlace-planilla" href="#" target="_blank" rel="noopener">Abrir la planilla<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <a href="../alumnos/" target="_blank" rel="noopener">Ver el portal del alumno<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <div class="pn-cuenta">
      <span class="pn-avatar" aria-hidden="true">PTH</span>
      <span class="pn-cuenta-mail" id="cuenta-mail"></span>
      <button class="pn-salir" type="button" data-accion="salir">Salir</button>
    </div>
  </div>
</aside>
<main id="vista" class="pn-main" tabindex="-1">
  <p class="pn-cargando">Cargando…</p>
</main>
<div class="pn-toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
