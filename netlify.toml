[build]
  command = "python3 build.py"
  publish = "dist"

# La apiKey de Firebase del portal es pública por diseño (va en el navegador): no es un secreto.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAHsllyFpBUZt4hlN-qEPcZ4hXaqfVHBQE"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "https://www.proftraininghub.com.ar/*"
  to = "https://proftraininghub.com.ar/:splat"
  status = 301
  force = true
